<!DOCTYPE html>
<html lang="en">

    <title>I Love You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="stage">

            <div class="bar bar-left"></div>

            <div class="message">

                <span class="love-word">
                    LOVE

                <span class="you-word">
                    YOU

                <span class="u">U</span>

            </div>

        </div>

    </main>

    <script src="scripts.js"></script>

</body>
</html>
